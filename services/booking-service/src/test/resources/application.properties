# Used by the tests only. It replaces src/main/resources/application.properties on the test
# classpath: no Config Server, no Eureka, and an in-memory H2 instead of PostgreSQL.
spring.cloud.config.enabled=false
spring.config.import=
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:bookingtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
