services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      # Defaults are for local development. Override them in infra/.env (never committed).
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
    volumes:
      # Named volume: the data survives "docker compose down" (only "down -v" deletes it)
      - postgres-data:/var/lib/postgresql/data
      # Creates one database per service the first time the volume is initialised
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ticketflow}"]
      interval: 5s
      timeout: 3s
      retries: 20

  config-server:
    build:
      context: ..
      dockerfile: services/config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      # Serve the live config-repo/ folder (mounted below): edit a file, no rebuild needed
      CONFIG_REPO: file:/config-repo/
    volumes:
      - ../config-repo:/config-repo:ro
    healthcheck:
      # The JRE image has no curl: a plain TCP check on the port is enough
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888'"]
      interval: 5s
      timeout: 3s
      retries: 20

  discovery-server:
    build:
      context: ..
      dockerfile: services/discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"

  customer-service:
    build:
      context: ..
      dockerfile: services/customer-service/Dockerfile
    container_name: customer-service
    ports:
      - "8081:8081"
    environment:
      # Inside the Compose network, Eureka is reached by its service name, never by localhost
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy

  event-service:
    build:
      context: ..
      dockerfile: services/event-service/Dockerfile
    container_name: event-service
    ports:
      - "8082:8082"
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      # Inside the Compose network the database is reached by its service name
      DB_URL: jdbc:postgresql://postgres:5432/event
      DB_USER: ${POSTGRES_USER:-ticketflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  booking-service:
    build:
      context: ..
      dockerfile: services/booking-service/Dockerfile
    container_name: booking-service
    ports:
      - "8083:8083"
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      # Inside the Compose network the database is reached by its service name
      DB_URL: jdbc:postgresql://postgres:5432/booking
      DB_USER: ${POSTGRES_USER:-ticketflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      # Inside the Compose network the database is reached by its service name
      DB_URL: jdbc:postgresql://postgres:5432/payment
      DB_USER: ${POSTGRES_USER:-ticketflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow}
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      # No more static URL: the gateway finds customer-service through Eureka (lb://)
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy

volumes:
  postgres-data:
